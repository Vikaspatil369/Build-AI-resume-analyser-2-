version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: resume-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ai_resume_analyzer
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build: ./backend
    container_name: resume-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      APP_AI_PROVIDER: mock  # Defaults to mock for immediate offline testing
      APP_AI_GEMINI_API_KEY: ""
      APP_AI_OPENAI_API_KEY: ""
      APP_JWT_SECRET: "9a7f6c5b4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a"
      APP_JWT_EXPIRATION: "86400000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: resume-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
