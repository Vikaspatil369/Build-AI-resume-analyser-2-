spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/ai_resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Mysql@123} 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  error:
    include-stacktrace: never

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # 256-bit key in hex
    expiration-ms: 86400000 # 24 hours
  ai:
    provider: ${AI_PROVIDER:mock} # Can be gemini, openai, mock
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-1.5-flash
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini

logging:
  level:
    root: INFO
    com.airesumeanalyzer.backend: DEBUG
    org.hibernate.SQL: INFO
